# Synchros — single node, full stack.
# Project-isolated: `name: Synchros` namespaces all containers/networks/volumes.
# Ports chosen after scanning the host: 5432/6379/9092 were free; the app uses
# 8081 because 8080 is claimed by unrelated local tooling (kind cluster).
name: Synchros

services:
  postgres:
    image: postgres:17-alpine
    container_name: Synchros-postgres
    environment:
      POSTGRES_DB: Synchros
      POSTGRES_USER: Synchros
      POSTGRES_PASSWORD: Synchros_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Synchros -d Synchros"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: Synchros-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    container_name: Synchros-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Two listeners: PLAINTEXT for in-compose traffic (app), HOST for the
      # host machine (k6, CLI tools). Advertised addresses are routable.
      KAFKA_LISTENERS: HOST://:9092,PLAINTEXT://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: Synchros-demo-cluster-0001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 20s

  app:
    build:
      context: ./backend
    container_name: Synchros-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Synchros
      SPRING_DATASOURCE_USERNAME: Synchros
      SPRING_DATASOURCE_PASSWORD: Synchros_local_dev
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: "8081"
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-only-webhook-secret-change-me-0123456789}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      PAYMENT_WEBHOOK_REPLAY_TOLERANCE_SECONDS: ${PAYMENT_WEBHOOK_REPLAY_TOLERANCE_SECONDS:-300}
      SECRET_POLICY_ENFORCE_NON_DEV: ${SECRET_POLICY_ENFORCE_NON_DEV:-true}
      SPAN_PROBE_ENABLED: ${SPAN_PROBE_ENABLED:-false}
    ports:
      - "8081:8081"

volumes:
  pgdata:
