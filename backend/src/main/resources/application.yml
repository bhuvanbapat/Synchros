spring:
  application:
    name: Synchros
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Synchros}
    username: ${SPRING_DATASOURCE_USERNAME:Synchros}
    password: ${SPRING_DATASOURCE_PASSWORD:Synchros_local_dev}
    hikari:
      maximum-pool-size: 40
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: Synchros
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
    max-connections: 8192
    accept-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: Synchros
  tracing:
    # Sampling for the opt-in tracing pipeline (active only when an OTLP
    # endpoint is configured below — no endpoint, no exporter, no overhead).
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # The switch itself: empty (default) = tracing dormant; set
      # OTEL_EXPORTER_OTLP_ENDPOINT (e.g. http://collector:4317) to export.
      # HTTP transport (default) POSTs protobuf to <endpoint>/v1/traces -
      # the collector receives on its OTLP HTTP port.
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
      transport: http
    metrics:
      # Disabled by default: the OTLP metrics registry otherwise pushes to
      # localhost:4318 every 60s even with no collector configured. The
      # Prometheus scrape endpoint remains the always-on metrics surface;
      # set OTEL_METRICS_EXPORT_ENABLED=true (plus url) for push metrics.
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}

logging:
  level:
    com.synchros: ${LOGGING_LEVEL_COM_SYNCHROS:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] [%thread] %logger{36} - %msg%n"

Synchros:
  # Background jobs (expiration scan, outbox drain). Tests exercise these
  # synchronously, so they are disabled in the test profile to avoid racing
  # with assertions (see application-test.yml).
  scheduling-enabled: ${SYNCHROS_SCHEDULING_ENABLED:true}
  hold-duration-seconds: ${HOLD_DURATION_SECONDS:120}
  expiration:
    scan-interval-ms: ${EXPIRATION_SCAN_INTERVAL_MS:1000}
    batch-size: ${EXPIRATION_BATCH_SIZE:100}
  rate-limit:
    reservations-per-minute: ${RATE_LIMIT_RESERVATIONS_PER_MINUTE:30}
    burst: ${RATE_LIMIT_BURST:10}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    max-retries: ${OUTBOX_MAX_RETRIES:10}
  payment:
    success-weight: ${PAYMENT_SUCCESS_WEIGHT:0.85}
    failure-weight: ${PAYMENT_FAILURE_WEIGHT:0.10}
    timeout-weight: ${PAYMENT_TIMEOUT_WEIGHT:0.05}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret-change-me-0123456789}
    webhook-replay-tolerance-seconds: ${PAYMENT_WEBHOOK_REPLAY_TOLERANCE_SECONDS:300}
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  secret-policy:
    # false only for machines that deliberately run the demo with the
    # documented placeholder secrets; prod-like profiles fail closed.
    enforce-non-dev: ${SECRET_POLICY_ENFORCE_NON_DEV:true}
  span-probe:
    # Opt-in dev drill endpoint (POST /api/dev/span-probe, JWT-protected):
    # emits one SDK span to verify collector wiring independently of HTTP
    # observation. Never enable in production.
    enabled: ${SPAN_PROBE_ENABLED:false}
